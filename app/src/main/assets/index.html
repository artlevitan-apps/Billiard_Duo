<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Геворк Бильярдинский — Бильярдный клуб</title><style>
:root{--gold:#dfc38a;--cream:#f6f1dd;--muted:#a8baa9;--dark:#07150f}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--dark);color:var(--cream);font-family:system-ui,Arial,sans-serif}button{font:inherit}.screen{position:fixed;inset:0;display:none}.screen.active{display:flex}.menu{align-items:center;justify-content:center;padding:4vw;background:radial-gradient(ellipse at 45% 45%,#1c3b2b,#08170f 78%)}.menu-inner{width:min(1330px,93vw);display:flex;justify-content:space-between;align-items:center;gap:55px}.menu h1{font-size:clamp(48px,5.2vw,86px);letter-spacing:-.05em;line-height:1.03;font-weight:700;margin:14px 0 19px}.menu h1 span{color:var(--gold)}.eyebrow{color:var(--gold);letter-spacing:.21em;font-size:clamp(13px,1.1vw,17px)}.tag{font-size:clamp(18px,1.5vw,24px);color:#bdcfbf;margin-bottom:29px}.actions{display:flex;flex-direction:column;align-items:flex-start;gap:12px}.action{border:1px solid #608266;border-radius:13px;padding:13px 25px;background:#153623;color:var(--cream);min-width:300px;text-align:left;font-weight:650;font-size:clamp(18px,1.45vw,23px);cursor:pointer}.action.secondary{background:transparent}.action.focused,.action:focus-visible{outline:3px solid var(--gold);background:#28533a}.portrait-wrap{width:min(29vw,370px);text-align:center;flex-shrink:0}.portrait{width:100%;aspect-ratio:1;object-fit:cover;border-radius:50%;border:7px solid #d2b680;box-shadow:0 0 0 12px #153624,0 24px 80px #0009}.portrait-caption{margin-top:25px;letter-spacing:.13em;color:var(--gold)}.foot{position:absolute;bottom:2.5vh;left:4.5vw;color:#839a88;font-size:clamp(12px,1vw,16px)}.game{flex-direction:column;align-items:center;background:radial-gradient(ellipse at center,#163727,#07140d 82%)}.hud{width:min(96vw,1740px);height:12vh;min-height:78px;display:flex;justify-content:space-between;align-items:center;gap:22px;padding:12px 20px}.player{display:flex;align-items:center;gap:14px;opacity:.56}.player.current{opacity:1}.player .score{font-size:clamp(32px,3.8vw,58px);font-weight:780;min-width:1.35em;text-align:center}.player .name{font-size:clamp(16px,1.45vw,23px);font-weight:800}.player .type{color:#b4c7b7;font-size:clamp(13px,1vw,17px)}.player.current .name{color:#ffdf9c}.player.current{background:#31513b;border:2px solid #edc578;box-shadow:0 0 20px #d7b46a33;border-radius:16px;padding:8px 15px;transform:scale(1.04)}.player{border:2px solid transparent;border-radius:16px;padding:8px 15px;min-width:238px;transition:background .12s,border-color .12s}.turn-badge{font-size:12px;font-weight:800;letter-spacing:.07em;color:#ffda87;min-height:17px}.player:not(.current) .turn-badge{opacity:0}.timer{text-align:center;min-width:125px;line-height:1.1}.timer .value{font-size:clamp(34px,3.4vw,51px);font-weight:750;font-variant-numeric:tabular-nums}.timer .label{color:#afc7b3;letter-spacing:.14em;font-size:12px}.timer.low{color:#ffbb84;animation:urgent .7s ease-in-out infinite alternate}.timer.low .value{font-size:clamp(45px,4.5vw,70px)}@keyframes urgent{to{transform:scale(1.09)}}.table-box{width:min(96vw,calc(76vh * 1.95));aspect-ratio:1.95;filter:drop-shadow(0 20px 32px #0009);flex:none;position:relative}canvas{width:100%;height:100%;display:block;border-radius:18px}.bottom{margin-top:.8vh;width:min(95vw,1690px);display:flex;justify-content:space-between;align-items:center;gap:18px;font-size:clamp(13px,1.1vw,19px);color:#c8d9c8}.bottom strong{color:var(--gold)}.power{display:flex;align-items:center;gap:12px}.track{width:clamp(115px,12vw,215px);height:17px;background:#2b4837;border-radius:20px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#75b18a,#edc583,#fa916c);border-radius:20px}.toast{position:absolute;top:12%;left:50%;transform:translateX(-50%);border:1px solid #c2a773;background:#082318ec;border-radius:16px;padding:14px 27px;text-align:center;font-size:clamp(20px,2.3vw,37px);font-weight:800;opacity:0;transition:opacity .18s;pointer-events:none;z-index:5;white-space:nowrap}.toast.show{opacity:1}.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#020a06c9;backdrop-filter:blur(7px);z-index:20}.overlay.active{display:flex}.modal{min-width:min(520px,87vw);max-width:min(760px,92vw);max-height:91vh;overflow:auto;background:#10281a;border:1px solid #78906a;border-radius:22px;padding:28px 34px;box-shadow:0 35px 110px #000c}.modal h2{font-size:clamp(29px,2.7vw,43px);margin:0 0 12px}.modal p,.modal li{font-size:clamp(17px,1.25vw,20px);line-height:1.5;color:#d0ddce}.modal .action{width:100%;margin:5px 0;min-width:0}.modal ul{padding-left:22px}.win-congrats{color:#f5d48e!important}.win .modal{border-color:#e6c77b;box-shadow:0 0 55px #d5aa5040,0 35px 110px #000c}.win-photo{width:min(170px,18vh);height:min(170px,18vh);object-fit:cover;display:block;margin:10px auto 20px;border:5px solid var(--gold);border-radius:50%;animation:appear .7s cubic-bezier(.2,1.3,.4,1) both}@keyframes appear{from{opacity:0;transform:scale(.4) rotate(-12deg)}to{opacity:1;transform:scale(1) rotate(0)}}.win .modal{text-align:center}.win .action{text-align:center}.small{font-size:14px;color:#a8bda9}.label-pill{border:1px solid #9eb69a;padding:7px 12px;border-radius:20px}.overlay .hint{color:var(--gold)}@media(max-width:760px){.menu-inner{gap:20px}.menu h1{font-size:40px}.portrait-wrap{width:24vw}.action{min-width:215px;padding:11px 15px}.hud{gap:8px;padding:5px}.player{gap:3px}.bottom{font-size:11px}.table-box{width:97vw}.track{width:80px}.modal{padding:20px}}
